# VulnScan reverse proxy.
# Place at /etc/nginx/sites-available/vulnscan and symlink into sites-enabled.
#
# The app has no built-in login, so this config adds HTTP basic auth. Create
# the password file first:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.vulnscan.htpasswd youruser
#
# For TLS, run certbot after this is live:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d vulnscan.example.com

server {
    listen 80;
    server_name vulnscan.example.com;   # change to your host/IP

    auth_basic "VulnScan";
    auth_basic_user_file /etc/nginx/.vulnscan.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the realtime console
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # long-running scans keep the socket open
    }
}
